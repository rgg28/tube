plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuservidor.tube'
    compileSdk 35

    defaultConfig {
        applicationId "com.tuservidor.tube"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.mozilla.geckoview:geckoview:159.0.20260925214453'
}
