```yaml
name: Compilar Tube APK Firmado Profesional

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo fuente limpio
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar Android Build Tools 29.0.3
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "build-tools;29.0.3"

    - name: Preparar Gradle 8.7
      run: |
        rm -rf .gradle app/.gradle build app/build
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x ./gradlew

    - name: Limpiar proyecto
      run: ./gradlew clean --no-daemon

    - name: Compilar APK en modo Release Puro
      run: ./gradlew assembleRelease --no-daemon

    - name: Firmar el APK usando tus secretos de GitHub
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Subir tu app Tube lista para instalar
      uses: actions/upload-artifact@v4
      with:
        name: Tube-Instalable-Sin-Anuncios
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
```
