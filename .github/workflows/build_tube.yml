name: Compilar Tube APK Firmado

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # NO usamos android-actions/setup-android@v3
      # porque estaba intentando procesar el paquete antiguo "tools".

      - name: Verificar Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Aceptar licencias Android
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Instalar SDK Android
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;29.0.3"

      - name: Verificar Build Tools
        run: |
          echo "===== BUILD TOOLS INSTALADOS ====="
          ls -lah "$ANDROID_SDK_ROOT/build-tools/"

          echo "===== ZIPALIGN 29.0.3 ====="
          ls -lah "$ANDROID_SDK_ROOT/build-tools/29.0.3/zipalign"

          echo "===== ZIPALIGN 34.0.0 ====="
          ls -lah "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign"

      - name: Crear Gradle Wrapper 8.6
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x ./gradlew

      - name: Verificar Gradle
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

      - name: Limpiar proyecto
        run: |
          ./gradlew clean --no-daemon

      - name: Compilar APK Release
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Mostrar APK generado
        run: |
          echo "===== APK GENERADO ====="
          find app/build/outputs -type f -name "*.apk" -print

          echo "===== CONTENIDO RELEASE ====="
          ls -lah app/build/outputs/apk/release || true

      - name: Verificar Secrets de firma
        run: |
          echo "===== VERIFICACIÓN DE SECRETS ====="

          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "SIGNING_KEY: OK"
          else
            echo "SIGNING_KEY: FALTA"
            exit 1
          fi

          if [ -n "${{ secrets.ALIAS }}" ]; then
            echo "ALIAS: OK"
          else
            echo "ALIAS: FALTA"
            exit 1
          fi

          if [ -n "${{ secrets.KEY_STORE_PASSWORD }}" ]; then
            echo "KEY_STORE_PASSWORD: OK"
          else
            echo "KEY_STORE_PASSWORD: FALTA"
            exit 1
          fi

          if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "KEY_PASSWORD: OK"
          else
            echo "KEY_PASSWORD: FALTA"
            exit 1
          fi

      - name: Firmar APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Mostrar APK firmado
        run: |
          echo "===== APK FIRMADO ====="
          echo "Archivo:"
          echo "${{ steps.sign_app.outputs.signedReleaseFile }}"

          echo "===== VERIFICACIÓN ====="
          ls -lah "${{ steps.sign_app.outputs.signedReleaseFile }}"

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: Tube-Instalable-Sin-Anuncios
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
