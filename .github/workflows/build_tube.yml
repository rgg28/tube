name: Compilar Tube APK Firmado

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR PROYECTO
      # ============================================================

      - name: Descargar código fuente
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. GRADLE 8.6
      # ============================================================

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Verificar Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # 5. LICENCIAS
      # ============================================================

      - name: Aceptar licencias Android
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      # ============================================================
      # 6. INSTALAR SDK Y BUILD TOOLS
      # ============================================================

      - name: Instalar SDK Android
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;29.0.3"


      # ============================================================
      # 7. VERIFICAR BUILD TOOLS
      # ============================================================

      - name: Verificar Build Tools
        run: |
          echo "===== BUILD TOOLS ====="

          ls -lah "$ANDROID_SDK_ROOT/build-tools/"

          echo "===== ZIPALIGN 29.0.3 ====="

          ls -lah \
            "$ANDROID_SDK_ROOT/build-tools/29.0.3/zipalign"

          echo "===== APKSIGNER 29.0.3 ====="

          ls -lah \
            "$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner"


      # ============================================================
      # 8. CREAR GRADLE WRAPPER
      # ============================================================

      - name: Crear Gradle Wrapper 8.6
        run: |
          gradle wrapper \
            --gradle-version 8.6 \
            --distribution-type bin

          chmod +x ./gradlew


      # ============================================================
      # 9. VERIFICAR GRADLE
      # ============================================================

      - name: Verificar Gradle
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version


      # ============================================================
      # 10. BUSCAR KEYSTORE EXISTENTE
      # ============================================================

      - name: Descargar keystore existente
        id: download_keystore
        uses: dawidd6/action-download-artifact@v11
        continue-on-error: true
        with:
          workflow: ${{ github.workflow }}
          name: Tube-Signing-Key
          path: signing/
          search_artifacts: true
          workflow_conclusion: success
          if_no_artifact_found: warn


      # ============================================================
      # 11. COMPROBAR SI EXISTE
      # ============================================================

      - name: Comprobar keystore
        id: check_keystore
        shell: bash
        run: |
          if [ -f "signing/signingKey.jks" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "======================================"
            echo "KEYSTORE ENCONTRADO"
            echo "======================================"

            ls -lah signing/signingKey.jks

          else
            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "======================================"
            echo "NO EXISTE KEYSTORE"
            echo "SE CREARA UNO NUEVO"
            echo "======================================"
          fi


      # ============================================================
      # 12. CREAR KEYSTORE SOLO LA PRIMERA VEZ
      # ============================================================

      - name: Crear signingKey.jks
        if: steps.check_keystore.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/signingKey.jks \
            -alias tube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Tube, OU=Development, O=Tube, L=Aguilares, ST=Tucuman, C=AR"

          echo "======================================"
          echo "KEYSTORE CREADO"
          echo "======================================"

          keytool -list \
            -keystore signing/signingKey.jks \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}"


      # ============================================================
      # 13. VERIFICAR KEYSTORE
      # ============================================================

      - name: Verificar keystore final
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFICACION DE KEYSTORE"
          echo "======================================"

          keytool -list \
            -keystore signing/signingKey.jks \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}"

          test -f signing/signingKey.jks

          echo "Keystore OK"


      # ============================================================
      # 14. LIMPIAR PROYECTO
      # ============================================================

      - name: Limpiar proyecto
        run: |
          ./gradlew clean --no-daemon


      # ============================================================
      # 15. COMPILAR APK
      # ============================================================

      - name: Compilar APK Release
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 16. MOSTRAR APK
      # ============================================================

      - name: Mostrar APK generado
        run: |
          echo "======================================"
          echo "APK GENERADO"
          echo "======================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          echo "======================================"

          ls -lah \
            app/build/outputs/apk/release/


      # ============================================================
      # 17. FIRMAR APK
      # ============================================================

      - name: Firmar APK
        shell: bash
        run: |

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner"

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"

          SIGNED="app/build/outputs/apk/release/Tube-release.apk"

          "$APKSIGNER" sign \
            --ks signing/signingKey.jks \
            --ks-key-alias tube \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED" \
            "$UNSIGNED"

          echo "======================================"
          echo "APK FIRMADO"
          echo "======================================"

          ls -lah "$SIGNED"


      # ============================================================
      # 18. VERIFICAR FIRMA
      # ============================================================

      - name: Verificar firma APK
        shell: bash
        run: |

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/Tube-release.apk


      # ============================================================
      # 19. GUARDAR KEYSTORE PARA FUTURAS EJECUCIONES
      # ============================================================

      - name: Guardar keystore
        if: steps.check_keystore.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tube-Signing-Key
          path: signing/signingKey.jks
          retention-days: 90


      # ============================================================
      # 20. SUBIR APK
      # ============================================================

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: Tube-Instalable-Sin-Anuncios
          path: app/build/outputs/apk/release/Tube-release.apk
          if-no-files-found: error
