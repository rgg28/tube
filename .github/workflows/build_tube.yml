name: Compilar Tube APK Firmado Profesional

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo fuente limpio
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Fuerza a descargar solo los cambios de hoy ignorando la cache del historial

    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Destruir Cache Residual de Linux
      run: |
        # Borramos todas las carpetas temporales ocultas del servidor
        rm -rf .gradle app/.gradle build app/build
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x ./gradlew
        ./gradlew clean --no-daemon

    - name: Compilar APK en modo Release Puro
      run: ./gradlew assembleRelease --no-daemon

    - name: Firmar el APK usando tus secretos de GitHub
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Subir tu app Tube lista para instalar
      uses: actions/upload-artifact@v4
      with:
        name: Tube-Instalable-Sin-Anuncios
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
