name: Compilar Tube APK Firmado

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Inyectar Manifiesto Perfecto y Validado
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://google.com">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Tube"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity
            android:name="com.tuservidor.tube.MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

    - name: Crear archivo gradlew y forzar Gradle 8.7
      run: |
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x ./gradlew
        rm -rf .gradle app/.gradle build app/build
        ./gradlew clean --no-daemon

    - name: Compilar APK en modo Release Puro
      run: ./gradlew assembleRelease --no-daemon

    - name: Generar clave y firmar el APK en la nube
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY || 'MIICdwIBADANBgkqhkiG9w0BAQEFAASCAmEwggJdAgEAAoGBANMxMzU3OTI0NgIDAQAB' }}
        alias: 'tube_key'
        keyStorePassword: 'tubepassword123'
        keyPassword: 'tubepassword123'

    - name: Subir tu app Tube lista para instalar
      uses: actions/upload-artifact@v4
      with:
        name: Tube-Instalable-Sin-Anuncios
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
