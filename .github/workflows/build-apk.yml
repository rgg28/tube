name: Compilar Tube GeckoView

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Aceptar licencias
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Crear Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Mostrar APK generado
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Tube-GeckoView-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
