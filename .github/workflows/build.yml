name: Build Tube Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          else
            echo "Android SDK environment variable not found."
            exit 1
          fi

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "Using SDK: $SDK"

          echo "sdkmanager:"
          find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true

          echo ""
          echo "Installed platforms:"
          ls -la "$SDK/platforms" 2>/dev/null || true

          echo ""
          echo "Installed build tools:"
          ls -la "$SDK/build-tools" 2>/dev/null || true

      - name: Install required Android packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -name sdkmanager \
            -type f \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          test -f "$SDK/build-tools/35.0.0/apksigner"
          test -f "$SDK/build-tools/35.0.0/aapt2"

          echo "Android SDK OK."

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PROJECT STRUCTURE"
          echo "=============================================="

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tuservidor/tube/MainActivity.java

          echo ""
          echo "Required files:"
          echo "OK: app/build.gradle"
          echo "OK: app/src/main/AndroidManifest.xml"
          echo "OK: MainActivity.java"

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tube"

          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Generate YouTube application icon
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          import struct
          import zlib

          W = 512
          H = 512

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          rows = []

          for y in range(H):
              row = bytearray()

              for x in range(W):

                  left = 55
                  right = 457
                  top = 105
                  bottom = 407
                  radius = 85

                  inside = False

                  if left + radius <= x <= right - radius:
                      inside = top <= y <= bottom

                  elif top + radius <= y <= bottom - radius:
                      inside = left <= x <= right

                  else:
                      corners = (
                          (left + radius, top + radius),
                          (right - radius, top + radius),
                          (left + radius, bottom - radius),
                          (right - radius, bottom - radius),
                      )

                      for cx, cy in corners:
                          if (x - cx) ** 2 + (y - cy) ** 2 <= radius ** 2:
                              inside = True
                              break

                  if inside:
                      r, g, b, a = 255, 0, 0, 255
                  else:
                      r, g, b, a = 0, 0, 0, 0

                  # Play button.
                  if inside:
                      if (
                          215 <= x <= 330
                          and abs(y - 256)
                          <= min(
                              (x - 215) * 0.58,
                              (330 - x) * 0.58
                          )
                      ):
                          r, g, b, a = 255, 255, 255, 255

                  row.extend((r, g, b, a))

              rows.append(b"\x00" + bytes(row))

          raw = b"".join(rows)

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      W,
                      H,
                      8,
                      6,
                      0,
                      0,
                      0
                  )
              )
              + chunk(
                  b"IDAT",
                  zlib.compress(raw, 9)
              )
              + chunk(b"IEND", b"")
          )

          with open(
              "app/src/main/res/drawable/ic_youtube.png",
              "wb"
          ) as f:
              f.write(png)
          PY

          file app/src/main/res/drawable/ic_youtube.png

      - name: Configure application icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")

          text = path.read_text()

          text = text.replace(
              'android:icon="@drawable/ic_youtube"',
              ''
          )

          text = text.replace(
              'android:roundIcon="@drawable/ic_youtube"',
              ''
          )

          text = text.replace(
              '<application',
              '''<application
                  android:icon="@drawable/ic_youtube"
                  android:roundIcon="@drawable/ic_youtube"''',
              1
          )

          path.write_text(text)
          PY

          grep -n "application" app/src/main/AndroidManifest.xml

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate release signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/keystore/tube-release.jks" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tube, OU=Android, O=Tube, L=Argentina, ST=Tucuman, C=AR"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/tube-release.jks" >> "$GITHUB_ENV"

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

      - name: Verify Gradle
        shell: bash
        run: |
          ./gradlew --version

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          set -e

          ./gradlew \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "RELEASE APK"
          echo "=============================================="

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
              echo "ERROR: Release APK was not generated."
              exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "=============================================="
          echo "VERIFYING SIGNATURE"
          echo "=============================================="

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          "$SDK/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE OK."

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" Tube-release.apk

          echo "=============================================="
          echo "FINAL APK"
          echo "=============================================="

          ls -lh Tube-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tube-release
          path: Tube-release.apk
          if-no-files-found: error
