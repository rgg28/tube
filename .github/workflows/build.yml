name: Build Tube Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Verify project files
        run: |
          echo "=============================================="
          echo "PROJECT STRUCTURE"
          echo "=============================================="

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tuservidor/tube/MainActivity.java

          echo "All required files found."

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tube"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Generate application icon
        run: |
          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          import struct
          import zlib

          W = 512
          H = 512

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          rows = []

          for y in range(H):
              row = bytearray()

              for x in range(W):
                  # Rounded red rectangle.
                  left = 55
                  right = 457
                  top = 105
                  bottom = 407
                  radius = 85

                  inside = False

                  if left + radius <= x <= right - radius:
                      inside = top <= y <= bottom

                  elif top + radius <= y <= bottom - radius:
                      inside = left <= x <= right

                  else:
                      corners = [
                          (left + radius, top + radius),
                          (right - radius, top + radius),
                          (left + radius, bottom - radius),
                          (right - radius, bottom - radius)
                      ]

                      for cx, cy in corners:
                          if (x - cx) ** 2 + (y - cy) ** 2 <= radius ** 2:
                              inside = True
                              break

                  r = 255 if inside else 0
                  g = 0
                  b = 0
                  a = 255 if inside else 0

                  # White play triangle.
                  if inside:
                      if (
                          x >= 215
                          and x <= 330
                          and abs(y - 256) <= min(
                              (x - 215) * 0.58,
                              (330 - x) * 0.58
                          )
                      ):
                          r = 255
                          g = 255
                          b = 255
                          a = 255

                  row.extend((r, g, b, a))

              rows.append(b"\x00" + bytes(row))

          raw = b"".join(rows)

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0)
              )
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )

          with open(
              "app/src/main/res/drawable/ic_youtube.png",
              "wb"
          ) as f:
              f.write(png)
          PY

          file app/src/main/res/drawable/ic_youtube.png

      - name: Configure application icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if 'android:icon=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:icon="@drawable/ic_youtube"\n        android:roundIcon="@drawable/ic_youtube"',
                  1
              )

          path.write_text(text)
          PY

          grep -n "application" app/src/main/AndroidManifest.xml

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate temporary signing key
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/keystore/tube-release.jks" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tube, OU=Android, O=Tube, L=Argentina, ST=Tucuman, C=AR"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/tube-release.jks" >> "$GITHUB_ENV"

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          echo "=============================================="
          echo "RELEASE APK"
          echo "=============================================="

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
              echo "ERROR: APK was not generated."
              exit 1
          fi

          echo "APK: $APK"
          ls -lh "$APK"

          echo ""
          echo "=============================================="
          echo "VERIFYING SIGNATURE"
          echo "=============================================="

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          cp "$APK" Tube-release.apk

          ls -lh Tube-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tube-release
          path: Tube-release.apk
          if-no-files-found: error
