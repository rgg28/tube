name: Build Tube Release

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
              SDK="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
              SDK="$ANDROID_SDK_ROOT"

          else
              echo "ERROR: Android SDK not found."
              exit 1
          fi

          echo "SDK=$SDK"

          echo ""
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo ""
          echo "Command line tools:"

          find "$SDK/cmdline-tools" \
            -name sdkmanager \
            -type f \
            2>/dev/null || true

          echo ""
          echo "Installed platforms:"

          ls -la "$SDK/platforms" \
            2>/dev/null || true

          echo ""
          echo "Installed build tools:"

          ls -la "$SDK/build-tools" \
            2>/dev/null || true


      # ============================================================
      # ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -name sdkmanager \
            -type f \
            2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found."
              exit 1
          fi

          echo "=============================================="
          echo "SDKMANAGER"
          echo "=============================================="

          echo "$SDKMANAGER"

          echo ""
          echo "Permissions:"

          ls -l "$SDKMANAGER"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android packages installed."


      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$SDK/platforms/android-35"

          test -d "$SDK/build-tools/35.0.0"

          test -f "$SDK/build-tools/35.0.0/aapt2"

          test -f "$SDK/build-tools/35.0.0/apksigner"

          echo ""
          echo "Android SDK OK."


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PROJECT STRUCTURE"
          echo "=============================================="

          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/tuservidor/tube/MainActivity.java

          echo ""
          echo "Required files:"

          echo "OK: app/build.gradle"

          echo "OK: app/src/main/AndroidManifest.xml"

          echo "OK: MainActivity.java"


      # ============================================================
      # SETTINGS.GRADLE
      # ============================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tube"

          include(":app")
          EOF

          echo "settings.gradle created."

          echo ""
          cat settings.gradle


      # ============================================================
      # ROOT BUILD.GRADLE
      # ============================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          set -e

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          echo "Root build.gradle created."

          echo ""
          cat build.gradle


      # ============================================================
      # GENERATE YOUTUBE ICON
      # ============================================================

      - name: Generate YouTube application icon
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          import struct
          import zlib

          W = 512
          H = 512

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      zlib.crc32(kind + data) & 0xffffffff
                  )
              )

          rows = []

          for y in range(H):

              row = bytearray()

              for x in range(W):

                  left = 55
                  right = 457

                  top = 105
                  bottom = 407

                  radius = 85

                  inside = False

                  if left + radius <= x <= right - radius:

                      inside = (
                          top <= y <= bottom
                      )

                  elif top + radius <= y <= bottom - radius:

                      inside = (
                          left <= x <= right
                      )

                  else:

                      corners = (
                          (
                              left + radius,
                              top + radius
                          ),
                          (
                              right - radius,
                              top + radius
                          ),
                          (
                              left + radius,
                              bottom - radius
                          ),
                          (
                              right - radius,
                              bottom - radius
                          )
                      )

                      for cx, cy in corners:

                          if (
                              (x - cx) ** 2
                              + (y - cy) ** 2
                              <= radius ** 2
                          ):
                              inside = True
                              break

                  if inside:

                      r = 255
                      g = 0
                      b = 0
                      a = 255

                  else:

                      r = 0
                      g = 0
                      b = 0
                      a = 0

                  if inside:

                      if (
                          215 <= x <= 330
                          and
                          abs(y - 256)
                          <= min(
                              (x - 215) * 0.58,
                              (330 - x) * 0.58
                          )
                      ):

                          r = 255
                          g = 255
                          b = 255
                          a = 255

                  row.extend(
                      (r, g, b, a)
                  )

              rows.append(
                  b"\x00" + bytes(row)
              )

          raw = b"".join(rows)

          png = (
              b"\x89PNG\r\n\x1a\n"

              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      W,
                      H,
                      8,
                      6,
                      0,
                      0,
                      0
                  )
              )

              + chunk(
                  b"IDAT",
                  zlib.compress(
                      raw,
                      9
                  )
              )

              + chunk(
                  b"IEND",
                  b""
              )
          )

          output = (
              "app/src/main/res/drawable/"
              "ic_youtube.png"
          )

          with open(output, "wb") as f:
              f.write(png)

          print(
              "Generated:",
              output
          )

          print(
              "Bytes:",
              len(png)
          )
          PY

          test -f \
            app/src/main/res/drawable/ic_youtube.png

          echo ""
          echo "Icon:"

          ls -lh \
            app/src/main/res/drawable/ic_youtube.png


      # ============================================================
      # CONFIGURE APPLICATION ICON
      # ============================================================

      - name: Configure application icon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          text = text.replace(
              'android:icon="@drawable/ic_youtube"',
              ''
          )

          text = text.replace(
              'android:roundIcon="@drawable/ic_youtube"',
              ''
          )

          text = text.replace(
              "<application",
              """<application
                  android:icon="@drawable/ic_youtube"
                  android:roundIcon="@drawable/ic_youtube" """,
              1
          )

          path.write_text(text)
          PY

          echo "=============================================="
          echo "MANIFEST"
          echo "=============================================="

          cat app/src/main/AndroidManifest.xml


      # ============================================================
      # GRADLE 8.9
      # ============================================================

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"

          GRADLE_DIR="$RUNNER_TEMP/gradle"

          mkdir -p "$GRADLE_DIR"

          echo "=============================================="
          echo "DOWNLOADING GRADLE $GRADLE_VERSION"
          echo "=============================================="

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o "$GRADLE_DIR/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "$GRADLE_DIR/gradle.zip" \
            -d "$GRADLE_DIR"

          GRADLE_BIN="$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin"

          echo "$GRADLE_BIN" >> "$GITHUB_PATH"

          export PATH="$GRADLE_BIN:$PATH"

          echo ""
          echo "Gradle version:"

          gradle --version


      # ============================================================
      # CREATE KEYSTORE
      # ============================================================

      - name: Generate release signing key
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GENERATING RELEASE KEYSTORE"
          echo "=============================================="

          mkdir -p keystore

          keytool \
            -genkeypair \
            -v \
            -keystore \
              "$PWD/keystore/tube-release.jks" \
            -storetype PKCS12 \
            -alias tube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tube_release_password \
            -keypass tube_release_password \
            -dname \
              "CN=Tube, OU=Android, O=Tube, L=Argentina, ST=Tucuman, C=AR"

          test -f \
            keystore/tube-release.jks

          echo ""
          echo "Keystore created:"

          ls -lh \
            keystore/tube-release.jks


      # ============================================================
      # CONFIGURE APP SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/build.gradle"
          )

          text = path.read_text()

          # Remove old automatically generated
          # signingConfigs block if present.

          start = text.find(
              "    signingConfigs {"
          )

          if start != -1:

              end = text.find(
                  "    buildTypes {",
                  start
              )

              if end == -1:

                  raise SystemExit(
                      "ERROR: buildTypes not found."
                  )

              text = (
                  text[:start]
                  + text[end:]
              )

          signing_config = """    signingConfigs {
              release {
                  storeFile file(
                      "${rootProject.projectDir}/keystore/tube-release.jks"
                  )
                  storePassword "tube_release_password"
                  keyAlias "tube"
                  keyPassword "tube_release_password"
              }
          }

          """

          marker = "    buildTypes {"

          if marker not in text:

              raise SystemExit(
                  "ERROR: buildTypes block not found."
              )

          text = text.replace(
              marker,
              signing_config + marker,
              1
          )

          # Remove an existing signing line.

          text = text.replace(
              "signingConfig signingConfigs.release",
              ""
          )

          release_marker = (
              "        release {"
          )

          if release_marker not in text:

              raise SystemExit(
                  "ERROR: release buildType not found."
              )

          text = text.replace(
              release_marker,
              """        release {
            signingConfig signingConfigs.release""",
              1
          )

          path.write_text(text)
          PY

          echo "=============================================="
          echo "FINAL app/build.gradle"
          echo "=============================================="

          cat app/build.gradle


      # ============================================================
      # CREATE GRADLE WRAPPER
      # ============================================================

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CREATING GRADLE WRAPPER"
          echo "=============================================="

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          test -f gradlew

          test -f \
            gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "Gradle wrapper created."

          ls -lh gradlew

          ls -lh gradle/wrapper/


      # ============================================================
      # VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING GRADLE"
          echo "=============================================="

          ./gradlew --version


      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING TUBE RELEASE"
          echo "=============================================="

          ./gradlew \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # INSPECT BUILD OUTPUT
      # ============================================================

      - name: Inspect APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "BUILD OUTPUT"
          echo "=============================================="

          if [ ! -f "$APK" ]; then

              echo "ERROR:"
              echo "Expected APK does not exist:"
              echo "$APK"

              echo ""
              echo "Available APK files:"

              find app/build/outputs \
                -type f \
                -name "*.apk" \
                -print \
                -exec ls -lh {} \;

              exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "Size:"

          ls -lh "$APK"

          echo ""
          echo "Bytes:"

          stat -c%s "$APK"

          echo ""
          echo "=============================================="
          echo "APK FILE TYPE"
          echo "=============================================="

          file "$APK"

          echo ""
          echo "=============================================="
          echo "APK CONTENTS"
          echo "=============================================="

          unzip -l "$APK"

          echo ""
          echo "=============================================="
          echo "DEX FILE"
          echo "=============================================="

          unzip -l "$APK" \
            | grep "classes.dex"

          echo ""
          echo "classes.dex detected."


      # ============================================================
      # VERIFY MANIFEST
      # ============================================================

      - name: Verify APK manifest
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "VERIFYING MANIFEST"
          echo "=============================================="

          unzip -l "$APK" \
            | grep "AndroidManifest.xml"

          echo ""
          echo "AndroidManifest.xml detected."


      # ============================================================
      # VERIFY APPLICATION CODE
      # ============================================================

      - name: Verify application code
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "VERIFYING APPLICATION CODE"
          echo "=============================================="

          unzip -l "$APK" \
            | grep "classes.dex"

          DEX_SIZE=$(
            unzip -l "$APK" \
              | awk '/classes\.dex$/ {print $1}'
          )

          echo ""
          echo "classes.dex size:"
          echo "$DEX_SIZE bytes"

          if [ -z "$DEX_SIZE" ]; then
              echo "ERROR: classes.dex not found."
              exit 1
          fi

          if [ "$DEX_SIZE" -le 1000 ]; then
              echo ""
              echo "WARNING:"
              echo "classes.dex is unusually small."
          fi

          echo ""
          echo "Application DEX detected."


      # ============================================================
      # VERIFY ICON
      # ============================================================

      - name: Verify APK icon
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "VERIFYING ICON"
          echo "=============================================="

          unzip -l "$APK" \
            | grep -E \
              "ic_youtube|resources\.arsc"

          echo ""
          echo "Icon/resources detected."


      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          "$SDK/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE OK."


      # ============================================================
      # PREPARE FINAL APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: Release APK not found."
              exit 1
          fi

          cp \
            "$APK" \
            Tube-release.apk

          echo "=============================================="
          echo "FINAL APK"
          echo "=============================================="

          ls -lh \
            Tube-release.apk

          echo ""
          echo "Final APK bytes:"

          stat -c%s \
            Tube-release.apk


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4

        with:
          name: Tube-release

          path: Tube-release.apk

          if-no-files-found: error
