name: Build Tube Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project
        run: |
          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tuservidor/tube/MainActivity.java

          echo "Project structure OK."

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tube"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Generate YouTube icon
        run: |
          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          import struct
          import zlib

          W = 512
          H = 512

          def png_chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          pixels = []

          for y in range(H):
              row = bytearray()

              for x in range(W):
                  # Rounded-ish red YouTube style background.
                  dx = abs(x - W / 2)
                  dy = abs(y - H / 2)

                  radius = 125
                  inside = (
                      (dx <= W / 2 - 35 and dy <= H / 2)
                      or
                      (dx <= W / 2 and dy <= H / 2 - 35)
                  )

                  if inside:
                      r, g, b, a = 255, 0, 0, 255
                  else:
                      r, g, b, a = 0, 0, 0, 0

                  # White play triangle.
                  if (
                      x >= 205
                      and x <= 325
                      and
                      abs(y - 256) <= (x - 205) * 0.62
                      and
                      abs(y - 256) <= (325 - x) * 0.62
                  ):
                      r, g, b, a = 255, 255, 255, 255

                  row.extend((r, g, b, a))

              pixels.append(b"\x00" + bytes(row))

          raw = b"".join(pixels)

          png = (
              b"\x89PNG\r\n\x1a\n"
              + png_chunk(
                  b"IHDR",
                  struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0)
              )
              + png_chunk(b"IDAT", zlib.compress(raw, 9))
              + png_chunk(b"IEND", b"")
          )

          with open(
              "app/src/main/res/drawable/ic_youtube.png",
              "wb"
          ) as f:
              f.write(png)
          PY

          echo "Icon generated."

      - name: Configure Android application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          text = p.read_text()

          if "signingConfigs" not in text:
              text = text.replace(
                  "buildTypes {",
                  """signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          buildTypes {"""
              )

          text = text.replace(
              """release {
              minifyEnabled false
              shrinkResources false
          }""",
              """release {
              minifyEnabled false
              shrinkResources false
              signingConfig signingConfigs.release
          }"""
          )

          p.write_text(text)
          PY

      - name: Configure application icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              '<application',
              '<application android:icon="@drawable/ic_youtube" android:roundIcon="@drawable/ic_youtube"',
              1
          )

          p.write_text(text)
          PY

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/keystore/tube-release.jks" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tube, OU=Android, O=Tube, L=Argentina, ST=Tucuman, C=AR"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/tube-release.jks" >> "$GITHUB_ENV"

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: tube_release_password
          KEY_PASSWORD: tube_release_password
          KEY_ALIAS: tube
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify Release APK
        run: |
          echo "=============================================="
          echo "RELEASE APK"
          echo "=============================================="

          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          apksigner verify \
            --verbose \
            "$APK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          cp "$APK" \
             "$GITHUB_WORKSPACE/Tube-release.apk"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tube-release
          path: Tube-release.apk
          if-no-files-found: error
